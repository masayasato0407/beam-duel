<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ビームデュエル</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ECE6F4;--surface:#FFFFFF;--text:#231C3D;--muted:#6A6185;--line:#CFC6DE;--off:#C9C2DA;--accent:#7A4C8C;
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#15122A;--surface:#211D3B;--text:#EEEAF8;--muted:#A49CC2;--line:#3A3460;--off:#3F3963;--accent:#E0A8F0;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#15122A;--surface:#211D3B;--text:#EEEAF8;--muted:#A49CC2;--line:#3A3460;--off:#3F3963;--accent:#E0A8F0;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  height:100%;margin:0;background:var(--bg);color:var(--text);
  font-family:"DotGothic16","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",system-ui,sans-serif;
  display:flex;flex-direction:column;overflow:hidden;
  -webkit-user-select:none;user-select:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent;
  -webkit-touch-callout:none;
}
.app{flex:1;display:flex;flex-direction:column;width:100%;max-width:1000px;margin:0 auto;padding:12px 14px;gap:10px;min-height:0}
.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.frame{position:relative;border-radius:10px;overflow:hidden;box-shadow:0 0 0 2px var(--line)}
canvas{display:block}
#cv{width:100%;height:100%}
#bossOv{overflow-y:auto;justify-content:safe center;gap:6px;padding:8px}
#bossOv h1{margin:0;font-size:22px}
#bossOv p{margin:0;font-size:12px}
#bossList{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px;width:100%;max-width:520px}
#bossList button{font-size:12px;padding:5px 6px;margin:0;width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.overlay{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:10px;text-align:center;padding:16px;background:rgba(20,16,44,.62);color:#FFF4E2;
}
.overlay[hidden]{display:none}
.overlay h1{margin:0;font-size:clamp(1.5rem,6vw,2.6rem);font-weight:400;letter-spacing:.06em;color:#FFE3A8;text-shadow:3px 3px 0 #3A2A6A}
.overlay p{margin:0;font-size:clamp(.75rem,2.4vw,1rem);line-height:1.6;max-width:34em}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:6px}
.overlay button{
  font:inherit;font-size:1.05rem;padding:9px 18px;border:0;border-radius:8px;
  background:#FFE3A8;color:#2A1F4D;cursor:pointer;box-shadow:0 4px 0 #B88A3E;
}
.overlay button.alt{background:#C9BEF0;box-shadow:0 4px 0 #7A6CB0}
#netCode{font:inherit;font-size:1.2rem;width:5.5em;text-align:center;padding:8px;border-radius:8px;border:2px solid #C9BEF0;background:#FFF4E2;color:#2A1F4D;letter-spacing:.2em}
.netcode{font-size:clamp(2rem,9vw,3.4rem) !important;letter-spacing:.25em;color:#FFE066}
#netMsg{color:#FF9A9A}
.diffrow{align-items:center}
.diffrow span{font-size:.95rem}
.overlay button.dbtn{padding:6px 12px;font-size:.95rem}
.overlay button.dbtn{opacity:.6}
.overlay button.dbtn[aria-pressed="true"]{opacity:1;background:#7AE07A;color:#123A12;box-shadow:0 4px 0 #3A8A3A;outline:3px solid #FFFFFF;outline-offset:2px;transform:scale(1.12)}
.overlay button.dbtn[aria-pressed="true"]::before{content:"✔ "}
.overlay button.dbtn[data-d="3"][aria-pressed="true"]{background:#FF5A4A;color:#FFFFFF;box-shadow:0 4px 0 #A82A1E}
.overlay button:active{transform:translateY(3px);box-shadow:none}
button:focus-visible{outline:3px solid var(--text);outline-offset:3px}
.overlay button:focus-visible{outline-color:#FFF4E2}

.select{
  position:fixed;inset:0;z-index:10;background:var(--bg);overflow-y:auto;
  padding:calc(env(safe-area-inset-top,0px) + 16px) 14px calc(env(safe-area-inset-bottom,0px) + 16px);
  display:flex;flex-direction:column;align-items:center;gap:14px;
}
.select[hidden]{display:none}
#tourPanel{z-index:15}
.tourmsg{margin:0;text-align:center;font-size:clamp(1rem,4vw,1.3rem);color:#FFE3A8}
.bracket{display:flex;gap:10px;justify-content:center;align-items:stretch;overflow-x:auto;padding:4px 2px}
.bcol{display:flex;flex-direction:column;justify-content:space-around;gap:8px;min-width:118px}
.bcol h3{margin:0 0 2px;font-weight:400;font-size:.9rem;text-align:center;color:var(--muted)}
.bm{border:2px solid var(--line);border-radius:10px;padding:4px 6px;display:flex;flex-direction:column;gap:2px;background:rgba(255,255,255,.03)}
.bm.now{border-color:#FFE066;box-shadow:0 0 0 2px rgba(255,224,102,.35)}
.be{display:flex;align-items:center;gap:6px;font-size:.88rem;white-space:nowrap}
.be i{width:10px;height:10px;border-radius:3px;flex:none}
.be.you{color:#FFE066}
.be.lose{opacity:.4;text-decoration:line-through}
.be.win{font-weight:700}
.be.tbd{color:var(--muted)}
.champ{font-size:clamp(1.1rem,4.5vw,1.6rem);text-align:center;color:#FFE066}
.tourbtns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.go{font:inherit;font-size:1.1rem;padding:10px 26px;border:0;border-radius:10px;background:#FFE3A8;color:#2A1F4D;cursor:pointer;box-shadow:0 4px 0 #B88A3E}
.go[hidden]{display:none}
.go:disabled{background:#4A4560;color:#B8B0D0;box-shadow:none;cursor:default}
.select h2{margin:0;font-weight:400;font-size:clamp(1.3rem,5vw,1.9rem);text-align:center}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;width:100%;max-width:960px}
.card{
  font:inherit;color:var(--text);text-align:left;background:var(--surface);border:2px solid var(--line);
  border-radius:14px;padding:12px;cursor:pointer;display:flex;flex-direction:column;gap:6px;
  border-top:8px solid var(--c);
}
.card:hover{border-color:var(--c)}
.card:active{transform:translateY(2px)}
.card canvas{width:96px;height:72px;align-self:center;image-rendering:pixelated}
.card .nm{font-size:1.35rem}
.card .spn{color:var(--accent);font-size:1rem}
.card .ds{font-size:.82rem;line-height:1.55;color:var(--muted)}
.card .st{font-size:.8rem}
.back{font:inherit;font-size:1rem;padding:8px 22px;border-radius:8px;border:2px solid var(--line);background:transparent;color:var(--text);cursor:pointer}

.controls{display:grid;grid-template-columns:1fr;gap:10px}
.controls.two{grid-template-columns:1fr 1fr}
.controls:not(.two) .pad.p2{display:none}
.pad{display:flex;justify-content:space-between;align-items:center;gap:10px}
.move,.acts{display:flex;gap:6px}
.move button{width:66px}
.acts button{flex:0 0 auto;width:80px;min-width:0}
.pad button{
  --p:100%;font:inherit;height:64px;border:0;border-radius:14px;cursor:pointer;touch-action:none;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  box-shadow:0 5px 0 rgba(0,0,0,.25);color:#fff;padding:0 4px;
}
.pad .big{font-size:1.3rem;white-space:nowrap}
.pad small{font-size:.75rem;opacity:.9;white-space:nowrap}
.p1 .mv,.p1 .jump{background:#2FB8B1;color:#06302E}
.p2 .mv,.p2 .jump{background:#E2504C}
.beam{background:linear-gradient(to right,var(--c) var(--p),var(--off) var(--p))}
.p1 .beam{--c:#3A7BEA}
.p2 .beam{--c:#C93D86}
.sp{background:linear-gradient(to right,#F2B33D var(--p),var(--off) var(--p));color:#3A2400}
.beam.cooling,.sp.cooling{color:var(--text)}
.sp.full{animation:pulse .7s ease-in-out infinite alternate}
@keyframes pulse{to{box-shadow:0 5px 0 rgba(0,0,0,.25),0 0 0 4px #FFE3A8}}
.pad button.on,.pad button:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.25)}
.controls.hand-l:not(.two) .pad{justify-content:flex-start;padding-left:12%;gap:36px}
.controls.hand-r:not(.two) .pad{justify-content:flex-end;padding-right:12%;gap:36px}
.controls.hand-l:not(.two) .move,.controls.hand-l:not(.two) .acts,.controls.hand-r:not(.two) .move,.controls.hand-r:not(.two) .acts{gap:12px}
.controls.two .pad{display:grid;grid-template-columns:1fr;gap:6px}
.controls.two .acts button{width:auto;flex:1}
.controls.two .move button{width:auto;flex:1}
.controls.two .pad button{height:50px;border-radius:10px}
.controls.two .big{font-size:.95rem}
.controls.two small{display:none}
.pbar{position:absolute;left:50%;bottom:6px;transform:translateX(-50%);display:flex;gap:6px}
.pbar[hidden]{display:none}
.pbar button{font:inherit;font-size:.8rem;padding:4px 10px;border:0;border-radius:6px;background:rgba(20,16,44,.72);color:#FFF4E2;cursor:pointer;white-space:nowrap}
.pbar button:focus-visible{outline:2px solid #FFF4E2;outline-offset:2px}
.sbtn{position:absolute;left:6px;bottom:6px;z-index:2;font:inherit;font-size:.8rem;padding:4px 10px;border:0;border-radius:6px;background:rgba(20,16,44,.72);color:#FFF4E2;cursor:pointer}
.sbtn:focus-visible{outline:2px solid #FFF4E2;outline-offset:2px}
.hint{text-align:center;color:var(--muted);font-size:.85rem;margin:0}
@media (hover:none){.hint{display:none}}
@media (max-height:480px){.pad button{height:56px}.controls.two .pad button{height:40px}.app{padding:8px 12px;gap:8px}}
@media (prefers-reduced-motion:reduce){.pad button.on,.pad button:active,.overlay button:active,.card:active{transform:none}.sp.full{animation:none;box-shadow:0 0 0 4px #FFE3A8}}
</style>
</head>
<body>
<div class="app">
  <div class="stage" id="stage">
    <div class="frame" id="frame">
      <canvas id="cv"></canvas>
      <div class="overlay" id="menuOv">
        <h1>ビームデュエル</h1>
        <p id="netMsg" hidden></p>
        <div class="row diffrow" role="group" aria-label="CPUのつよさ">
          <span>CPUのつよさ：</span>
          <button class="alt dbtn" data-d="0">よわい</button>
          <button class="alt dbtn" data-d="1">ふつう</button>
          <button class="alt dbtn" data-d="2">つよい</button>
          <button class="alt dbtn" data-d="3">🔥げきむず</button>
        </div>
        <div class="row"><button id="hyperBtn" class="alt">💥 はげしいバトル：OFF</button></div>
        <div class="row diffrow" role="group" aria-label="コントローラーの位置">
          <span>🎮 コントローラー：</span>
          <button class="alt dbtn hbtn" data-h="l">⬅ ひだり</button>
          <button class="alt dbtn hbtn" data-h="r">みぎ ➡</button>
        </div>
        <p>左右に動いて、ジャンプでよけて、ビームを当てよう。ビームは3秒に1回。体力10を先に削りきったほうの勝ち。<br>攻撃を当てたり受けたりすると必殺ゲージがたまる。必殺技はキャラごとにちがう。</p>
        <div class="row">
          <button id="onlineBtn" style="font-size:1.15em;padding:10px 28px">🌐 オンライン対戦</button>
        </div>
        <div class="row">
          <button id="cpuBtn">CPUと対戦</button>
          <button id="teamBtn" class="alt">2vs2（なかまもCPU）</button>
          <button id="team3Btn" class="alt">3vs3（なかまもCPU）</button>
          <button id="vsBtn" class="alt">ふたりで対戦</button>
        </div>
        <div class="row">
          <button id="tourBtn" class="alt">🏆 トーナメント</button>
          <button id="bossBtn" class="alt">👑 ボス戦</button>
          <button id="practiceBtn" class="alt">練習（ダミー）</button>
        </div>
      </div>
      <div class="overlay" id="bossOv" hidden>
        <h1>👑 ボスをえらぼう</h1>
        <p>下にいくほど体力が多くて強いボスだよ。</p>
        <div class="row" id="bossList"></div>
        <div class="row"><button id="bossBack" class="alt">もどる</button></div>
      </div>
      <div class="pbar" id="pbar" hidden>
        <button id="charChangeBtn">キャラ変更</button>
        <button id="dummyBtn">ダミー：立つ</button>
        <button id="quitBtn">練習をやめる</button>
      </div>
      <div class="overlay" id="netOv" hidden>
        <h1>オンライン対戦</h1>
        <p id="netStatus">部屋をつくるか、相手から聞いた4けたのコードを入れてね。</p>
        <div class="row" id="netChoose">
          <button id="netCreate">1vs1の部屋をつくる</button>
          <button id="netCreateT">🏆 トーナメント部屋をつくる</button>
          <button id="netCreate2">👥 2vs2の部屋をつくる</button>
          <button id="netCreate3">👥 3vs3の部屋をつくる</button>
          <input id="netCode" inputmode="numeric" maxlength="4" placeholder="1234" aria-label="部屋のコード">
          <button id="netJoin" class="alt">コードで入る</button>
        </div>
        <p class="netcode" id="netCodeShow" hidden></p>
        <p id="netDiag" style="font-size:.75rem;opacity:.8"></p>
        <div class="row"><button id="netCancel" class="alt">やめる</button></div>
      </div>
      <div class="overlay" id="overOv" hidden>
        <h1 id="winText">あなたの勝ち！</h1>
        <p id="tallyText"></p>
        <p id="netWait" hidden>ホストが次をえらぶのを待っています…</p>
        <div class="row">
          <button id="retryBtn">もう一度</button>
          <button id="charBtn" class="alt">キャラ選択</button>
          <button id="modeBtn" class="alt">モード選択</button>
        </div>
      </div>
      <button class="sbtn" id="soundBtn" aria-label="音のオンとオフ">♪ ON</button>
    </div>
  </div>
  <div class="controls" id="controls">
    <div class="pad p1" data-p="0">
      <div class="move">
        <button class="mv" data-a="left" aria-label="左へ移動"><span class="big">◀</span></button>
        <button class="mv" data-a="right" aria-label="右へ移動"><span class="big">▶</span></button>
      </div>
      <div class="acts">
        <button class="jump" data-a="jump"><span class="big">ジャンプ</span><small class="who">あなた</small></button>
        <button class="beam" data-a="beam"><span class="big">ビーム</span><small class="sub">発射OK</small></button>
        <button class="sp" data-a="sp"><span class="big">必殺</span><small class="sub">0%</small></button>
      </div>
    </div>
    <div class="pad p2" data-p="1">
      <div class="move">
        <button class="mv" data-a="left" aria-label="2P 左へ移動"><span class="big">◀</span></button>
        <button class="mv" data-a="right" aria-label="2P 右へ移動"><span class="big">▶</span></button>
      </div>
      <div class="acts">
        <button class="jump" data-a="jump"><span class="big">ジャンプ</span><small>2P</small></button>
        <button class="beam" data-a="beam"><span class="big">ビーム</span><small class="sub">発射OK</small></button>
        <button class="sp" data-a="sp"><span class="big">必殺</span><small class="sub">0%</small></button>
      </div>
    </div>
  </div>
  <p class="hint" id="hint"></p>
</div>

<div class="select" id="selectPanel" hidden>
  <h2 id="selTitle">キャラを選んでください</h2>
  <div class="cards" id="cards"></div>
  <button class="back" id="selBack">もどる</button>
</div>

<div class="select" id="tourPanel" hidden>
  <h2 id="tourTitle">トーナメント</h2>
  <p class="tourmsg" id="tourMsg"></p>
  <div class="bracket" id="bracket"></div>
  <div class="tourbtns">
    <button class="go" id="tourGo">試合開始！</button>
    <button class="back" id="tourShuffle" hidden>チームをシャッフル</button>
    <button class="back" id="tourQuit">やめる</button>
  </div>
</div>

<script>
(() => {
  let LW = 640, LH = 360, GROUND = 300;
  const G = 2300, JUMP_V = 900, COOLDOWN = 3, BOLT_V = 720, BOLT_LEN = 70;
  const PW = 34, PH = 44, MAXHP = 10;
  const SP_H = 64, MEGA_TIME = 0.45, DASH_V = 900, WAVE_V = 520, FREEZE = 1.5;

  const CHARS = [
    { id: 'bolt', name: 'ボルト', sp: 'mega', spName: 'メガビーム', speed: 230, charge: 0.55,
      desc: '極太ビームを前に撃つ。2ダメージ。ジャンプでよけられる。',
      body: '#3FD0C9', dark: '#1E6E6A', arm: '#2A8F8A', bolt: '#5BD8FF', glow: 'rgba(159,247,255,.35)', mega: '#7FE6FF' },
    { id: 'blaze', name: 'ブレイズ', sp: 'meteor', spName: 'メテオレイン', speed: 210, charge: 0.45,
      desc: '相手の頭上に隕石を5つ降らせる。1つ1ダメージ。走ってよけよう。',
      body: '#F07A3A', dark: '#8E3A1E', arm: '#C25A28', bolt: '#FFB347', glow: 'rgba(255,190,110,.35)', mega: '#FFB347' },
    { id: 'gale', name: 'ゲイル', sp: 'dash', spName: '疾風ダッシュ', speed: 275, charge: 0.35,
      desc: '無敵の高速突進。ぶつかると2ダメージ。ジャンプでよけられる。',
      body: '#8BD45A', dark: '#3F6E26', arm: '#5E9E3A', bolt: '#C8FF7A', glow: 'rgba(200,255,140,.35)', mega: '#C8FF7A' },
    { id: 'frost', name: 'フロスト', sp: 'wave', spName: 'アイスウェーブ', speed: 230, charge: 0.4,
      desc: '地面を走る氷の波。当たると1ダメージ＋1.5秒こおって動けない。',
      body: '#9AB8FF', dark: '#3E4F9A', arm: '#6F86D6', bolt: '#D6E8FF', glow: 'rgba(214,232,255,.4)', mega: '#D6E8FF' },
    { id: 'shadow', name: 'シャドウ', sp: 'warp', spName: '影ワープ斬り', speed: 260, charge: 0.4,
      desc: '相手の背後にワープして斬りつける。2ダメージ。ワープを見たらすぐジャンプ！',
      body: '#7A5AC8', dark: '#3A2870', arm: '#5A44A0', bolt: '#C9A8FF', glow: 'rgba(201,168,255,.35)', mega: '#C9A8FF' },
    { id: 'gaia', name: 'ガイア', sp: 'quake', spName: 'グランドクエイク', speed: 190, charge: 0.55,
      desc: '地面をたたいて画面全体をゆらす。地上にいる相手に2ダメージ。空中にいれば当たらない。',
      body: '#B08A5A', dark: '#5E4426', arm: '#8A6A40', bolt: '#E8D2A8', glow: 'rgba(232,210,168,.35)', mega: '#E8D2A8' },
    { id: 'luna', name: 'ルナ', sp: 'barrier', spName: 'ムーンバリア', speed: 230, charge: 0.3,
      desc: '体力を1回復して3秒間バリアを張る。バリア中は攻撃が効かず、ビームは跳ね返す。',
      body: '#F2A6C8', dark: '#9A4A72', arm: '#D47AA4', bolt: '#FFD6EC', glow: 'rgba(255,214,236,.4)', mega: '#FFD6EC' },
    { id: 'boom', name: 'ボム', sp: 'bomb', spName: 'ビッグボム', speed: 225, charge: 0.35,
      desc: '相手めがけて爆弾を投げる。着地して少したつと大爆発、2ダメージ。走って逃げよう。',
      body: '#F2D04A', dark: '#6E5A12', arm: '#C8A830', bolt: '#FFE680', glow: 'rgba(255,230,128,.35)', mega: '#FFE680' },
    { id: 'jet', name: 'ジェット', sp: 'missile', spName: 'ホーミングミサイル', speed: 245, charge: 0.35,
      desc: '追いかけてくるミサイルを3発撃つ。1発1ダメージ。ビームで撃ち落とせる。',
      body: '#C8CCD8', dark: '#5A5F70', arm: '#9096A8', bolt: '#FF6A5A', glow: 'rgba(255,120,100,.35)', mega: '#FF8A7A' },
    { id: 'nova', name: 'ノヴァ', sp: 'hole', spName: 'ブラックホール', speed: 215, charge: 0.45,
      desc: '相手の後ろにブラックホールを出して引き寄せる。吸い込まれると2ダメージ。全力で逃げよう。',
      body: '#3A3F8C', dark: '#1C1F4A', arm: '#2C3070', bolt: '#B0A8FF', glow: 'rgba(176,168,255,.35)', mega: '#B0A8FF' },
    { id: 'hawk', name: 'ホーク', sp: 'snipe', spName: 'ロックオンショット', speed: 220, charge: 0.3,

        if (h.warn > 0) {
          ctx.fillStyle = Math.floor(h.warn * 20) % 2 ? 'rgba(255,90,40,.85)' : 'rgba(255,170,60,.5)';
          ctx.beginPath(); ctx.ellipse(h.x, GROUND + 2, 20, 5, 0, 0, Math.PI * 2); ctx.fill();
          ctx.fillRect(h.x - 1, GROUND - 6, 2, 6);
        } else {
          const hh = 75 * Math.min(1, (0.3 - h.act) / 0.06 + 0.2);
          ctx.fillStyle = 'rgba(255,138,58,.4)'; ctx.fillRect(h.x - 24, GROUND - hh - 6, 48, hh + 6);
          ctx.fillStyle = '#E8642A'; ctx.fillRect(h.x - 18, GROUND - hh, 36, hh);
          ctx.fillStyle = '#FFB347'; ctx.fillRect(h.x - 10, GROUND - hh, 20, hh);
          ctx.fillStyle = '#FFE066'; ctx.fillRect(h.x - 4, GROUND - hh, 8, hh);
        }
      } else if (h.kind === 'net') {
        ctx.strokeStyle = '#FFFFFF'; ctx.lineWidth = 1.5; ctx.beginPath();
        for (let i = 0; i < 6; i++) { const a = i * Math.PI / 3; ctx.moveTo(h.x, h.y); ctx.lineTo(h.x + Math.cos(a) * 26, h.y + Math.sin(a) * 18); }
        ctx.moveTo(h.x + 13, h.y); ctx.ellipse(h.x, h.y, 13, 9, 0, 0, Math.PI * 2);
        ctx.moveTo(h.x + 24, h.y); ctx.ellipse(h.x, h.y, 24, 16, 0, 0, Math.PI * 2);
        ctx.stroke();
      } else if (h.kind === 'web') {
        ctx.globalAlpha = 0.85 * Math.min(1, h.t / 0.5); ctx.strokeStyle = '#FFFFFF'; ctx.lineWidth = 1.5; ctx.beginPath();
        for (let i = -4; i <= 4; i++) { ctx.moveTo(h.x, GROUND - 2); ctx.lineTo(h.x + i * 12, GROUND - 2 - (4 - Math.abs(i)) * 2.5); }
        ctx.moveTo(h.x - 50, GROUND - 1); ctx.lineTo(h.x + 50, GROUND - 1);
        ctx.stroke(); ctx.globalAlpha = 1;
      } else if (h.kind === 'bat') {
        const flap = Math.sin(h.ph * 3) * 6;
        ctx.save(); ctx.translate(h.x, h.y); if (h.dir < 0) ctx.scale(-1, 1);
        ctx.fillStyle = '#2A0A14';
        tri(ctx, -2, 0, -14, -6 - flap, -8, 4); tri(ctx, 2, 0, 14, -6 - flap, 8, 4);
        ctx.beginPath(); ctx.arc(0, 0, 5, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#FF4A6A'; ctx.fillRect(1, -2, 2, 2);
        ctx.restore();
      } else if (h.kind === 'zap') {
        if (h.warn > 0) {
          const on = Math.floor(h.warn * 16) % 2;
          ctx.strokeStyle = on ? 'rgba(255,244,106,.9)' : 'rgba(255,244,106,.35)'; ctx.lineWidth = 2; ctx.setLineDash([6, 6]);
          ctx.strokeRect(h.x - 16, 0, 32, GROUND); ctx.setLineDash([]);
          ctx.fillStyle = 'rgba(255,244,106,.35)'; ctx.beginPath(); ctx.ellipse(h.x, GROUND + 2, 18, 4, 0, 0, Math.PI * 2); ctx.fill();
        } else {
          ctx.fillStyle = 'rgba(255,244,106,.45)'; ctx.fillRect(h.x - 16, 0, 32, GROUND);
          ctx.strokeStyle = '#FFFFFF'; ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo(h.x, 0);
          for (let y = 30; y <= GROUND; y += 30) ctx.lineTo(h.x + ((y / 30) % 2 ? 10 : -10), y);
          ctx.stroke();
        }
      } else if (h.kind === 'swamp') {
        const k = Math.min(1, h.age / 0.3) * (h.t < 0.4 ? Math.max(0, h.t) / 0.4 : 1);
        ctx.fillStyle = 'rgba(80,160,60,.8)'; ctx.beginPath(); ctx.ellipse(h.x, GROUND + 3, h.w / 2 * k + 1, 8 * k + 1, 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = 'rgba(182,255,90,.85)';
        for (let i = 0; i < 4; i++) {
          const bx = h.x + Math.sin(clock * 2 + i * 1.7) * h.w * 0.35 * k;
          ctx.beginPath(); ctx.arc(bx, GROUND - 1, 3 + Math.sin(clock * 6 + i) * 1.5, 0, Math.PI * 2); ctx.fill();
        }
      } else if (h.kind === 'clone') {
        const ow = fighters[h.owner], face = foeOf(h.owner).x >= h.x ? 1 : -1;
        ctx.save(); ctx.globalAlpha = 0.55 * Math.min(1, h.t / 0.5 + 0.2);
        if (face < 0) { ctx.translate(h.x + PW, 0); ctx.scale(-1, 1); } else ctx.translate(h.x, 0);
        drawRobot(ctx, ow.ch, h.y, { t: clock }); ctx.restore();
      } else if (h.kind === 'fist') {
        const ow = fighters[h.owner];
        ctx.save(); ctx.translate(h.x, h.y); if (h.dir < 0) ctx.scale(-1, 1);
        ctx.fillStyle = 'rgba(255,192,138,.5)'; ctx.fillRect(-30, -6, 16, 12);
        ctx.fillStyle = ow.ch.arm; rrect(ctx, -15, -12, 30, 24, 6); ctx.fill();
        ctx.fillStyle = ow.ch.dark; for (let i = 0; i < 3; i++) ctx.fillRect(7, -9 + i * 7, 6, 4);
        ctx.restore();
      } else if (h.kind === 'petal') {
        ctx.save(); ctx.translate(h.x, h.y); ctx.rotate(h.spin);
        ctx.fillStyle = '#FF9EC0'; ctx.beginPath(); ctx.ellipse(0, 0, 8, 4.5, 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#FFE0EC'; ctx.beginPath(); ctx.ellipse(2, 0, 3, 1.5, 0, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
      } else if (h.kind === 'missile') {
        ctx.save(); ctx.translate(h.x, h.y); ctx.rotate(Math.atan2(h.vy, h.vx));
        ctx.fillStyle = Math.floor(clock * 20) % 2 ? '#FFB347' : '#FFE066'; ctx.fillRect(-15, -2.5, 6, 5);
        ctx.fillStyle = '#E8E8F0'; ctx.fillRect(-9, -3.5, 14, 7);
        ctx.fillStyle = '#E2504C'; tri(ctx, 5, -3.5, 11, 0, 5, 3.5); ctx.fillRect(-9, -5.5, 4, 11);
        ctx.restore();
      } else if (h.kind === 'hole') {
        const r = 30 * Math.min(1, h.age / 0.4) * (h.t < 0.3 ? Math.max(0, h.t) / 0.3 : 1);
        ctx.fillStyle = 'rgba(176,168,255,.22)'; ctx.beginPath(); ctx.arc(h.x, h.y, r * 1.9, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = '#B0A8FF'; ctx.lineWidth = 3;
        for (let i = 0; i < 3; i++) { const a = clock * 6 + i * 2.1; ctx.beginPath(); ctx.arc(h.x, h.y, r * 1.4, a, a + 1.2); ctx.stroke(); }
        ctx.fillStyle = '#0B0820'; ctx.beginPath(); ctx.arc(h.x, h.y, r, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = '#E8E0FF'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(h.x, h.y, r, 0, Math.PI * 2); ctx.stroke();
      } else if (h.kind === 'snipe') {
        ctx.fillStyle = 'rgba(255,240,122,.35)'; ctx.fillRect(h.x - 6, h.y - 12, 102, 24);
        ctx.fillStyle = '#FFF07A'; ctx.fillRect(h.x, h.y - 7, 90, 14);
        ctx.fillStyle = '#FFFFFF'; ctx.fillRect(h.x + 4, h.y - 2.5, 82, 5);
      } else if (h.kind === 'tornado') {
        for (let i = 0; i < 8; i++) {
          const yy = GROUND - 6 - i * 10, w = 10 + i * 4, off = Math.sin(clock * 18 + i * 0.9) * 5;
          ctx.fillStyle = i % 2 ? 'rgba(224,255,255,.8)' : 'rgba(150,220,215,.8)';
          ctx.beginPath(); ctx.ellipse(h.x + off, yy, w, 5, 0, 0, Math.PI * 2); ctx.fill();
        }
      } else if (h.kind === 'blast') {
        const k = 1 - h.t / 0.35;
        ctx.fillStyle = `rgba(255,200,90,${0.65 * (1 - k)})`; ctx.beginPath(); ctx.arc(h.x, h.y, 30 + 55 * k, 0, Math.PI * 2); ctx.fill();
      } else if (h.kind === 'wave') {
        ctx.fillStyle = 'rgba(214,232,255,.35)'; ctx.fillRect(h.x - 30, GROUND - 34, 60, 34);
        for (let i = -2; i <= 2; i++) {
          const x = h.x + i * 10, hh = 30 - Math.abs(i) * 6 + Math.sin(clock * 30 + i) * 2;
          ctx.fillStyle = i % 2 ? '#BFD8FF' : '#F2F8FF';
          tri(ctx, x - 6, GROUND, x, GROUND - hh, x + 6, GROUND);
        }
      }
    }
  }

  const HEART = [[1,0],[2,0],[4,0],[5,0],[0,1],[1,1],[2,1],[3,1],[4,1],[5,1],[6,1],[0,2],[1,2],[2,2],[3,2],[4,2],[5,2],[6,2],[1,3],[2,3],[3,3],[4,3],[5,3],[2,4],[3,4],[4,4],[3,5]];
  function heart(x, y, on, c, half) {
    ctx.fillStyle = on && !half ? c : 'rgba(255,255,255,.18)';
    for (const [a, b] of HEART) ctx.fillRect(x + a * 2, y + b * 2, 2, 2);
    if (on && half) { ctx.fillStyle = c; for (const [a, b] of HEART) if (a < 3.5) ctx.fillRect(x + a * 2, y + b * 2, 2, 2); }
  }

  function drawHud() {
    ctx.font = '15px "DotGothic16", sans-serif'; ctx.textBaseline = 'top';
    if (isTeam() && fighters.length >= 4) {
      const K = LW / 640, W = 640; ctx.save(); ctx.scale(K, K);
      for (const f of fighters) {
        const left = team(f.side) === 0, row = fighters.filter(o => team(o.side) === team(f.side) && o.side < f.side).length, y = 6 + row * 24, x0 = left ? 12 : W - 12;
        const label = roleOf(f.side);
        ctx.textAlign = left ? 'left' : 'right'; ctx.font = '11px "DotGothic16", sans-serif';
        ctx.fillStyle = f.ko ? '#8A8AA0' : isMeSide(f.side) ? '#FFE066' : left ? '#9AD8FF' : '#FF9A9A';
        ctx.fillText(`${label} ${f.ch.name}`, x0, y);
        const bw = f.boss ? 220 : 120, bx = left ? x0 : x0 - bw, by = y + 13;
        ctx.fillStyle = 'rgba(20,16,44,.6)'; ctx.fillRect(bx, by, bw, 6); ctx.fillRect(bx, by + 7, bw, 3);
        const hp = Math.max(0, f.hp) / (f.maxHp || MAXHP), gp = f.gauge / 100;
        ctx.fillStyle = f.ko ? '#555' : hp > 0.3 ? f.ch.body : '#E2504C';
        if (left) ctx.fillRect(bx, by, bw * hp, 6); else ctx.fillRect(bx + bw * (1 - hp), by, bw * hp, 6);
        ctx.fillStyle = gp >= 1 ? (Math.floor(clock * 6) % 2 ? '#FFD23F' : '#FFF4D6') : '#F2B33D';
        if (left) ctx.fillRect(bx, by + 7, bw * gp, 3); else ctx.fillRect(bx + bw * (1 - gp), by + 7, bw * gp, 3);
        ctx.fillStyle = '#FFF4E2'; ctx.font = '10px "DotGothic16", sans-serif';
        ctx.textAlign = left ? 'left' : 'right'; ctx.fillText(f.ko ? 'ダウン' : String(f.hp), left ? bx + bw + 4 : bx - 4, by - 2);
      }
      const p = fighters[mode === 'online' ? Math.max(0, mySide()) : 0], bp = Math.min(1, (clock - p.lastBeam) / cdOf(p)), by2 = 8 + (mode === 'boss' ? 5 : teamN()) * 24;
      ctx.fillStyle = 'rgba(20,16,44,.6)'; ctx.fillRect(12, by2, 120, 4);
      ctx.fillStyle = bp >= 1 ? p.ch.bolt : 'rgba(255,255,255,.55)'; ctx.fillRect(12, by2, 120 * bp, 4);
      ctx.textAlign = 'center'; ctx.font = '18px "DotGothic16", sans-serif';
      const t = `${wins[0]} − ${wins[1]}`;
      ctx.fillStyle = '#2A1F4D'; ctx.fillText(t, W / 2 + 1, 11);
      ctx.fillStyle = '#FFE3A8'; ctx.fillText(t, W / 2, 10);
      ctx.restore();
      return;
    }
    for (const f of fighters) {
      const left = f.side === 0, x0 = left ? 14 : LW - 14;
      ctx.textAlign = left ? 'left' : 'right';
      const fs = Math.min(15, Math.floor(58 / f.ch.name.length));
      ctx.font = `${fs}px "DotGothic16", sans-serif`;
      ctx.fillStyle = '#2A1F4D'; ctx.fillText(f.ch.name, x0 + 1, 11);
      ctx.fillStyle = '#FFF4E2'; ctx.fillText(f.ch.name, x0, 10);
      for (let i = 0; i < MAXHP; i++) {
        const hx = left ? x0 + 62 + i * 15 : x0 - 62 - 14 - i * 15;
        heart(hx, 13, i < f.hp, f.ch.body, f.hp - i > 0 && f.hp - i < 1);
      }
      const bw = 140, bx = left ? x0 : x0 - bw;
      const bp = state === 'menu' || state === 'select' ? 1 : Math.min(1, (clock - f.lastBeam) / cdOf(f));
      ctx.fillStyle = 'rgba(20,16,44,.55)'; ctx.fillRect(bx, 32, bw, 7); ctx.fillRect(bx, 42, bw, 7);
      ctx.fillStyle = bp >= 1 ? f.ch.bolt : 'rgba(255,255,255,.55)';
      if (left) ctx.fillRect(bx, 32, bw * bp, 7); else ctx.fillRect(bx + bw * (1 - bp), 32, bw * bp, 7);
      const gp = f.gauge / 100;
      ctx.fillStyle = gp >= 1 ? (Math.floor(clock * 6) % 2 ? '#FFD23F' : '#FFF4D6') : '#F2B33D';
      if (left) ctx.fillRect(bx, 42, bw * gp, 7); else ctx.fillRect(bx + bw * (1 - gp), 42, bw * gp, 7);
    }
    ctx.textAlign = 'center'; ctx.font = '18px "DotGothic16", sans-serif';
    const t = mode === 'practice' ? `ダメージ ${practiceDmg}` : `${wins[0]} − ${wins[1]}`;
    ctx.fillStyle = '#2A1F4D'; ctx.fillText(t, LW / 2 + 1, 11);
    ctx.fillStyle = '#FFE3A8'; ctx.fillText(t, LW / 2, 10);
  }

  function banner(text, size) {
    size = Math.round(size * LW / 640);
    ctx.font = `${size}px "DotGothic16", sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = '#3A2A6A'; ctx.fillText(text, LW / 2 + 3, LH * 0.42 + 3);
    ctx.fillStyle = '#FFE3A8'; ctx.fillText(text, LW / 2, LH * 0.42);
  }

  function ridge(off, base, amp, color, k) {
    ctx.fillStyle = color; ctx.beginPath(); ctx.moveTo(0, GROUND);
    for (let x = 0; x <= LW + 16; x += 16) {
      const u = (x + off) * k;
      ctx.lineTo(x, base - amp * (0.55 * Math.sin(u) + 0.3 * Math.sin(u * 2.3 + 1) + 0.15 * Math.sin(u * 5.1 + 2)));
    }
    ctx.lineTo(LW, GROUND); ctx.closePath(); ctx.fill();
  }

  function drawStage() {
    const tn = performance.now() / 1000;
    for (let i = 0; i < 2; i++) {
      const ox = i ? LW - 40 : 40, a = (i ? -1 : 1) * (0.35 + Math.sin(tn * 0.8 + i * 2) * 0.35);
      const ex = ox + Math.sin(a) * 340, ey = Math.cos(a) * 340;
      ctx.fillStyle = `rgba(255,240,200,${0.04 + 0.07 * hype})`;
      ctx.beginPath(); ctx.moveTo(ox - 6, -10); ctx.lineTo(ex - 60, ey); ctx.lineTo(ex + 60, ey); ctx.lineTo(ox + 6, -10); ctx.closePath(); ctx.fill();
    }
    ctx.fillStyle = '#2A2048'; ctx.fillRect(-10, GROUND - 54, LW + 20, 54);
    for (const p of crowd) {
      const jumpAmt = 1.5 + hype * 9;
      const b = Math.max(0, Math.sin(tn * (5 + hype * 6) + p.ph)) * jumpAmt;
      const y = GROUND - (p.row ? 42 : 30) - b, s = p.row ? 0.8 : 1;
      ctx.globalAlpha = p.row ? 0.55 : 0.75;
      ctx.fillStyle = p.c;
      ctx.fillRect(p.x - 5 * s, y, 10 * s, 14 * s);
      ctx.beginPath(); ctx.arc(p.x, y - 5 * s, 5 * s, 0, Math.PI * 2); ctx.fill();
      if (hype > 0.5) {
        const wave = Math.sin(tn * 10 + p.ph) * 3;
        ctx.fillRect(p.x - 7 * s + wave, y - 13 * s, 2, 9 * s); ctx.fillRect(p.x + 5 * s - wave, y - 13 * s, 2, 9 * s);
      }
      if (p.sign && hype > 0.3) {
        ctx.globalAlpha = 0.85; ctx.fillStyle = '#FFF4E2'; ctx.fillRect(p.x - 9, y - 26, 18, 10);
        ctx.fillStyle = p.c; ctx.fillRect(p.x - 6, y - 23, 12, 4);
      }
    }
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#3A2E63'; ctx.fillRect(-10, GROUND - 18, LW + 20, 4);
    for (let x = 0; x < LW; x += 32) ctx.fillRect(x, GROUND - 18, 3, 18);
    for (const cf of camFlashes) {
      ctx.fillStyle = `rgba(255,255,255,${cf.t / 0.12})`;
      ctx.fillRect(cf.x - 4, cf.y - 1, 8, 2); ctx.fillRect(cf.x - 1, cf.y - 4, 2, 8);
    }
  }

  function draw() {
    ctx.setTransform(scale, 0, 0, scale, 0, 0);
    if (shake > 0) ctx.translate(rand(-6, 6) * shake / 0.45, rand(-6, 6) * shake / 0.45);
    const sky = ctx.createLinearGradient(0, 0, 0, GROUND);
    sky.addColorStop(0, '#1F2A5A'); sky.addColorStop(0.6, '#7A4C8C'); sky.addColorStop(1, '#F2A65A');
    ctx.fillStyle = sky; ctx.fillRect(-10, -10, LW + 20, LH + 20);
    ctx.fillStyle = 'rgba(255,212,138,.9)';
    ctx.beginPath(); ctx.arc(LW / 2, GROUND - 64, 58, 0, Math.PI * 2); ctx.fill();
    const drift = performance.now() / 1000 * 4;
    ridge(drift, GROUND - 64, 46, '#4A3F7E', 0.012);
    ridge(300 + drift * 2, GROUND - 30, 26, '#3A2E63', 0.02);
    drawStage();
    ctx.fillStyle = '#4B3456'; ctx.fillRect(-10, GROUND, LW + 20, LH - GROUND + 10);
    ctx.fillStyle = '#B9708A'; ctx.fillRect(-10, GROUND, LW + 20, 3);
    ctx.fillStyle = '#5E4269';
    for (let i = 0; i < Math.ceil(LW / 48) + 1; i++) { ctx.fillRect(i * 48 + 10, GROUND + 16, 22, 4); ctx.fillRect(i * 48 + 34, GROUND + 38, 14, 4); }

    for (const f of fighters) drawFighter(f);
    drawHazards();
    for (const b of bolts) {
      const ch = fighters[b.owner].ch;
      ctx.globalAlpha = b.ghost ? 0.2 : 1;
      if (b.big) {
        ctx.fillStyle = 'rgba(255,240,122,.4)'; rrect(ctx, b.x - 12, b.y - 22, BOLT_LEN + 24, 44, 22); ctx.fill();
        ctx.fillStyle = ch.bolt; rrect(ctx, b.x - 6, b.y - 15, BOLT_LEN + 12, 30, 15); ctx.fill();
        ctx.fillStyle = '#FFFFFF'; rrect(ctx, b.x, b.y - 6, BOLT_LEN, 12, 6); ctx.fill(); continue;
      }
      if (b.homing) { ctx.fillStyle = 'rgba(200,200,216,.5)'; ctx.fillRect(b.x - 2, b.y - 13, BOLT_LEN + 4, 2); ctx.fillRect(b.x - 2, b.y + 11, BOLT_LEN + 4, 2); }
      ctx.fillStyle = ch.glow; rrect(ctx, b.x - 4, b.y - 10, BOLT_LEN + 8, 20, 10); ctx.fill();
      ctx.fillStyle = ch.bolt; rrect(ctx, b.x, b.y - 5, BOLT_LEN, 10, 5); ctx.fill();
      ctx.fillStyle = '#FFFFFF'; ctx.fillRect(b.x + 6, b.y - 1.5, BOLT_LEN - 12, 3);
    }
    ctx.globalAlpha = 1;
    for (const f of fighters) { drawMega(f); drawSpecialFx(f); }
    for (const q of parts) {
      ctx.globalAlpha = Math.max(0, q.life / q.max); ctx.fillStyle = q.c;
      ctx.fillRect(q.x - 3, q.y - 3, 6, 6);
    }
    ctx.globalAlpha = 1;

    for (const fl of floats) {
      ctx.globalAlpha = Math.min(1, fl.t / 0.35);
      ctx.font = `${fl.size}px "DotGothic16", sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillStyle = '#2A1F4D'; ctx.fillText(fl.text, fl.x + 2, fl.y + 2);
      ctx.fillStyle = fl.c; ctx.fillText(fl.text, fl.x, fl.y);
    }
    ctx.globalAlpha = 1;
    if (flashT > 0) { ctx.fillStyle = `rgba(255,255,255,${Math.min(0.5, flashT * 3)})`; ctx.fillRect(-10, -10, LW + 20, LH + 20); }
    drawHud();
    if (state === 'count') banner('レディ…', 40);
    else if (state === 'play' && fightT > 0) banner('ファイト！', 52);
    else if (state === 'ko') banner('ケーオー！', 52);
  }

  // ---------- select cards ----------
  const cardsEl = document.getElementById('cards');
  const stars = s => '★'.repeat(s) + '☆'.repeat(3 - s);
  CHARS.forEach((ch, i) => {
    const b = document.createElement('button');
    b.className = 'card'; b.style.setProperty('--c', ch.body);
    const spd = ch.speed >= 255 ? 3 : ch.speed >= 225 ? 2 : 1;
    b.innerHTML = `<canvas width="192" height="144"></canvas>
      <span class="nm">${ch.name}</span>
      <span class="st">スピード ${stars(spd)}</span>
      <span class="spn">必殺：${ch.spName}</span>
      <span class="ds">${ch.desc}</span>`;
    const c = b.querySelector('canvas').getContext('2d');
    c.scale(3, 3); c.translate(20, 0);
    drawRobot(c, ch, 44, { t: 0 });
    b.addEventListener('click', () => pick(i));
    cardsEl.appendChild(b);
  });
  {
    const b = document.createElement('button');
    b.className = 'card'; b.style.setProperty('--c', '#7A4C8C');
    b.innerHTML = `<span class="nm" style="font-size:3rem;text-align:center;line-height:72px">？</span>
      <span class="nm">ランダム</span><span class="ds">だれになるかはお楽しみ。</span>`;
    b.addEventListener('click', () => pick(Math.floor(Math.random() * CHARS.length)));
    cardsEl.appendChild(b);
  }

  // ---------- buttons UI ----------
  const cache = new Map();
  function setBtn(btn, pct, sub) {
    const key = Math.round(pct * 100) + sub;
    if (cache.get(btn) === key) return;
    cache.set(btn, key);
    btn.style.setProperty('--p', Math.round(pct * 100) + '%');
    btn.classList.toggle('cooling', pct < 1);
    btn.querySelector('.sub').textContent = sub;
  }
  function updateUI() {
    controls.querySelectorAll('.pad').forEach(pad => {
      const f = fighters[mode === 'online' ? Math.max(0, mySide()) : +pad.dataset.p] || fighters[0];
      const idle = state === 'menu' || state === 'select';
      const cd = cdOf(f), el = idle ? cd : clock - f.lastBeam;
      const bp = Math.min(1, el / cd);

        const mem = (L && L.lob || []).filter(x => tm === null || x[3] === tm);
        for (const x of mem) { const d = document.createElement('div'); d.className = 'be' + (x[2] === me ? ' you' : ''); d.textContent = rowTxt(x); col.appendChild(d); }
        if (isT) for (let k = mem.length; k < ts; k++) { const d = document.createElement('div'); d.className = 'be tbd'; d.textContent = 'CPU'; col.appendChild(d); }
        el.appendChild(col);
      }
      document.getElementById('tourShuffle').hidden = !(isT && isHost);
      const ready = (L && L.lob || []).filter(x => x[1] !== null && x[1] !== undefined).length;
      go.hidden = !isHost; go.disabled = ready < 2; go.textContent = ready < 2 ? 'あと1人以上まってね' : `スタート！（${ready}人）`;
      quit.textContent = 'ぬける';
      return;
    }
    document.getElementById('tourShuffle').hidden = true;
    if (!T || !T.ent) return;
    tour.ent = T.ent.map(e => ({ ch: e[0], you: e[1] === me, lab: e[2] }));
    tour.rounds = T.rd.map(R => R.slice()); tour.r = Math.min(T.r, 2); tour.curPair = T.cur;
    const done = !!T.done;
    let msg = T.msg || '';
    if (!done && T.cur && T.cur.some(i => T.ent[i][1] === me)) msg += '<br><b>あなたの番！</b>';
    else if (!done && !isHost) msg += '<br>ホストが試合を始めるのを待っています…';
    netOv.hidden = true; showBracket(msg, done);
    go.hidden = !isHost; go.disabled = false;
    go.textContent = done ? 'ロビーにもどる' : '試合開始！';
    quit.textContent = 'ぬける';
  }
  function netTick() {
    if (mode !== 'online' || !net.R) return;
    if (net.role === 'host') {
      const o = otherPeer(), op = o && o.presence;
      if (net.kind === 'duel') {
        if (net.phase === 'select' && net.myPick !== null && op && op.pick !== null && op.pick !== undefined && op.pr === net.selRound) {
          picks = [net.myPick, op.pick | 0]; if (!CHARS[picks[1]]) picks[1] = 0;
          net.ctl = ['H', o.peer]; net.lab = ['P1', 'P2'];
          net.phase = 'play'; selectPanel.hidden = true; netReset(); startRound(); hostSyncSeen();
        }
      } else if (net.phase === 'lobby' && net.myPick !== null) {
        const sig = JSON.stringify(otLobbyT());
        if (sig !== net.lastSig) { net.lastSig = sig; otRender(); }
      }
      if (net.phase === 'play' && state !== 'play') hostSyncSeen();
      hostSend();
      return;
    }
    const h = hostPeer(), op = h && h.presence;
    if (!op) return;
    net.kind = op.kind || 'duel'; net.ctl = op.ctl || null; net.lab = op.lab || null; net.tsize = op.ts || 2;
    if (op.ph === 'select' && op.sr > net.selRound) {
      net.selRound = op.sr; net.myPick = null; net.phase = 'select';
      netOv.hidden = true; overOv.hidden = true; netReset(); openSelect();
    } else if (op.ph === 'lobby') {
      if (op.sr > net.selRound) { net.selRound = op.sr; net.myPick = null; net.phase = 'select'; net.gPh = 'lobby'; netOv.hidden = true; tourPanel.hidden = true; openSelect(); return; }
      if (net.myPick === null) return;
      net.phase = 'lobby'; net.gPh = 'lobby'; net.gT = op.T;
      const sig = 'L' + JSON.stringify(op.T);
      if (sig !== net.lastSig) { net.lastSig = sig; otRender(); }
    } else if ((op.ph === 'bracket' || op.ph === 'done') && op.T) {
      net.gPh = op.ph; net.gT = op.T; net.phase = op.ph;
      const sig = op.ph + op.tv + JSON.stringify(op.T);
      if (sig !== net.lastSig) { net.lastSig = sig; stopBgm(); otRender(); }
    } else if (op.ph === 'play' && op.s && (net.kind !== 'duel' || op.sr === net.selRound)) {
      if (net.phase !== 'play') { setField(); net.phase = 'play'; net.lastSig = ''; selectPanel.hidden = true; netOv.hidden = true; menuOv.hidden = true; tourPanel.hidden = true; startBgm(); floats = []; parts = []; }
      applySnap(op.s);
    }
  }

  function loop(t) {
    const dt = Math.min((t - last) / 1000, 0.05); last = t;
    if (mode === 'online' && net.R) {
      if (net.role === 'guest') { netTick(); updateFx(dt); draw(); updateUI(); requestAnimationFrame(loop); return; }
    }
    if (state === 'count') { countT -= dt; if (countT <= 0) { state = 'play'; fightT = 0.7; sfx('fight'); addHype(0.3); } }
    else if (state === 'play') { if (hitStop > 0) hitStop -= dt; else update(dt); }
    else if (state === 'ko' || state === 'over') {
      clock += dt; physics(dt, false);
      for (const f of fighters) if (f.sp) { f.sp.t -= dt; if (f.sp.t <= 0) f.sp = null; }
      for (const b of bolts) b.x += b.dir * BOLT_V * dt;
    }
    updateFx(dt);
    if (onlineHost()) netTick();
    draw(); updateUI();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
  // keep online lobby/sync alive while this tab is in the background (rAF is paused there)
  setInterval(() => { if (document.hidden && mode === 'online' && net.R) { try { netTick(); } catch (e) {} } }, 200);

  // ---------- input ----------
  function act(side, a, down) {
    if (onlineGuest()) { if (side === 0) guestInput(a, down); return; }
    if (onlineHost()) { const hs = net.ctl ? net.ctl.indexOf('H') : -1; if (side !== 0 || hs < 0 || !fighters[hs]) return; side = hs; }
    const f = fighters[side];
    if (mode !== 'vs' && mode !== 'online' && side === 1) return;
    if (a === 'left') f.held.l = down;
    else if (a === 'right') f.held.r = down;
    else if (down) { if (a === 'jump') jump(f); else if (a === 'beam') fire(f); else if (a === 'sp') special(f); }
  }
  controls.querySelectorAll('.pad').forEach(pad => {
    const side = +pad.dataset.p;
    pad.querySelectorAll('button').forEach(btn => {
      const a = btn.dataset.a;
      btn.addEventListener('pointerdown', ev => {
        ev.preventDefault();
        try { btn.setPointerCapture(ev.pointerId); } catch (e) {}
        btn.classList.add('on'); act(side, a, true);
      });
      const up = () => { btn.classList.remove('on'); act(side, a, false); };
      btn.addEventListener('pointerup', up);
      btn.addEventListener('pointercancel', up);
      btn.addEventListener('lostpointercapture', up);
      btn.addEventListener('contextmenu', ev => ev.preventDefault());
    });
  });

  document.getElementById('cpuBtn').addEventListener('click', () => { setMode('cpu'); openSelect(); });
  document.getElementById('vsBtn').addEventListener('click', () => { setMode('vs'); openSelect(); });
  document.getElementById('teamBtn').addEventListener('click', () => { setMode('team'); openSelect(); });
  document.getElementById('team3Btn').addEventListener('click', () => { setMode('team3'); openSelect(); });
  document.getElementById('practiceBtn').addEventListener('click', () => { setMode('practice'); openSelect(); });
  document.getElementById('charChangeBtn').addEventListener('click', ev => { ev.currentTarget.blur(); openSelect(); });
  dummyBtn.addEventListener('click', () => {
    dummyMode = (dummyMode + 1) % DUMMY_MODES.length;
    dummyBtn.textContent = `ダミー：${DUMMY_MODES[dummyMode]}`;
    dummyBtn.blur();
  });
  document.getElementById('quitBtn').addEventListener('click', ev => {
    ev.currentTarget.blur();
    state = 'menu'; pbar.hidden = true; overOv.hidden = true; menuOv.hidden = false; stopBgm();
    fighters = [makeF(0), makeF(1)]; bolts = []; hazards = [];
  });
  document.getElementById('retryBtn').addEventListener('click', startRound);
  document.getElementById('charBtn').addEventListener('click', () => {
    if (onlineHost()) { net.selRound++; net.phase = net.kind === 'team' ? 'lobby' : 'select'; net.myPick = null; net.lastSig = ''; overOv.hidden = true; openSelect(); hostSend(); return; }
    openSelect();
  });
  document.getElementById('modeBtn').addEventListener('click', () => {
    if (mode === 'online') { leaveOnline(''); return; }
    state = 'menu'; overOv.hidden = true; menuOv.hidden = false; pbar.hidden = true; stopBgm();
    fighters = [makeF(0), makeF(1)]; bolts = []; hazards = [];
  });

  const KEYS = {
    cpu: { ArrowLeft: [0, 'left'], KeyA: [0, 'left'], ArrowRight: [0, 'right'], KeyD: [0, 'right'],
      Space: [0, 'jump'], ArrowUp: [0, 'jump'], KeyW: [0, 'jump'], KeyX: [0, 'beam'], KeyJ: [0, 'beam'], KeyC: [0, 'sp'], KeyK: [0, 'sp'] },
    vs: { KeyA: [0, 'left'], KeyD: [0, 'right'], KeyW: [0, 'jump'], KeyF: [0, 'beam'], KeyG: [0, 'sp'],
      ArrowLeft: [1, 'left'], ArrowRight: [1, 'right'], ArrowUp: [1, 'jump'], KeyK: [1, 'beam'], KeyL: [1, 'sp'] }
  };
  KEYS.practice = KEYS.cpu;
  function onKey(ev, down) {
    if (state !== 'count' && state !== 'play' && state !== 'ko') return;
    const m = (KEYS[mode] || KEYS.cpu)[ev.code];
    if (!m) return;
    ev.preventDefault();
    if (down && ev.repeat) return;
    act(m[0], m[1], down);
  }
  window.addEventListener('keydown', ev => onKey(ev, true));
  window.addEventListener('keyup', ev => onKey(ev, false));
  window.addEventListener('blur', () => fighters.forEach(f => { f.held.l = f.held.r = false; }));

  setMode('cpu');
})();
</script>
</body>
</html>
